---
- name: Create app directory on target
  ansible.builtin.file:
    path: "/tmp/{{ project_name }}"
    state: directory
    mode: "0755"

- name: Render app environment file from template
  ansible.builtin.template:
    src: app.env.j2
    dest: "/tmp/{{ project_name }}/app.env"
    mode: "0640"
  notify: App config changed

- name: Show rendered env file
  ansible.builtin.shell: "cat /tmp/{{ project_name }}/app.env"
  register: env_output
  changed_when: false

- name: Display env file contents
  ansible.builtin.debug:
    msg: "{{ env_output.stdout_lines }}"

- name: Verify app image is available locally
  ansible.builtin.command: "docker images -q {{ app_image }}"
  register: image_check
  changed_when: false
  failed_when: false

- name: Report image availability
  ansible.builtin.debug:
    msg: >-
      App image {{ app_image }} is
      {{ 'available locally' if image_check.stdout else 'NOT available — would be pulled from registry' }}
